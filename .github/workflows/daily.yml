name: Daily subnet 28 snapshot
on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Optional number of earlier days to attempt"
        required: false
        default: "0"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: {group: daily-snapshot, cancel-in-progress: false}
jobs:
  collect:
    outputs:
      pushed_sha: ${{ steps.push.outputs.pushed_sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install -e .
          python -m pip install -r requirements.txt
      - name: Collect snapshot
        env:
          TAOSTATS_API_KEY: ${{ secrets.TAOSTATS_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python -m sven28m_monitor.collector --backfill-days "${{ inputs.backfill_days || '0' }}"
          python -m sven28m_monitor.sheets
      - name: Commit and push data
        id: push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/
          git diff --cached --quiet || git commit -m "data: daily subnet 28 snapshot"
          for attempt in 1 2 3; do
            # Rebase onto any merge or settings-page commit that landed while
            # this run was collecting. -X theirs applies this run's data
            # commit when data files conflict.
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 2))
            fi
          done
          echo "Unable to push the daily snapshot after 3 attempts." >&2
          exit 1
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.collect.outputs.pushed_sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
