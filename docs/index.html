<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>sven28M monitor</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="alternate icon" href="favicon.png" type="image/png"><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><p class="eyebrow">BITTENSOR / NETUID 28</p><h1>sven28M</h1><p id="status">Loading latest snapshot…</p></div><a href="https://github.com">Source on GitHub</a></header>
<section class="cards"><div><b id="count">—</b><span>tracked today</span></div><div><b id="time">—</b><span>last observed (UTC)</span></div><div><b id="ranking">Emission</b><span>ranking priority</span></div></section>

<section id="detail" class="panel hidden"><button onclick="closeDetail()">← Back to ranking</button><h2 id="detail-title"></h2><div id="detail-meta"></div><canvas id="chart" width="900" height="260"></canvas><p id="chart-note" class="chart-note"></p><table><thead><tr><th>Date</th><th>Rank</th><th>Alpha</th><th>TAO</th><th>Δ rank</th></tr></thead><tbody id="history"></tbody></table></section>
</main><script src="app.js"></script></body></html>
